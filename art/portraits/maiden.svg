<svg xmlns="http://www.w3.org/2000/svg" width="300" height="380" viewBox="0 0 300 380">
  <!-- Ink silhouette of the heroine: long hair, side bow, wide kimono sleeves.
       Drawn in greys; the game tints it with modulate and adds a rim-light pass. -->
  <g fill="#2b2b2b">
    <!-- hair mass falling behind the shoulders -->
    <path d="M150 52 C102 52 82 92 84 140 C86 196 70 250 54 300 C88 296 104 286 112 262 L112 236 L188 236 L188 262 C196 286 212 296 246 300 C230 250 214 196 216 140 C218 92 198 52 150 52 Z"/>
    <!-- kimono body and sleeves -->
    <path d="M150 214 C120 214 98 222 84 238 C56 268 34 320 22 380 L278 380 C266 320 244 268 216 238 C202 222 180 214 150 214 Z"/>
    <!-- neck -->
    <path d="M136 176 L164 176 L166 222 L134 222 Z"/>
    <!-- face -->
    <path d="M150 82 C122 82 108 104 108 132 C108 160 126 186 150 190 C174 186 192 160 192 132 C192 104 178 82 150 82 Z"/>
    <!-- fringe -->
    <path d="M150 60 C114 60 96 86 98 120 C108 108 118 100 128 98 C130 110 136 116 142 118 C146 106 152 100 160 98 C170 104 178 112 186 124 C194 116 200 120 204 126 C206 88 186 60 150 60 Z"/>
    <!-- bow -->
    <path d="M96 76 L58 48 L52 92 Z"/>
    <path d="M96 76 L118 40 L132 72 Z"/>
    <circle cx="96" cy="76" r="9"/>
  </g>
  <g fill="none" stroke="#6d6d6d" stroke-linecap="round">
    <!-- hair strands -->
    <path d="M98 150 C94 200 86 240 70 286" stroke-width="2"/>
    <path d="M202 150 C206 200 214 240 230 286" stroke-width="2"/>
    <path d="M110 170 C108 210 106 236 104 258" stroke-width="1.5"/>
    <path d="M190 170 C192 210 194 236 196 258" stroke-width="1.5"/>
    <!-- collar crossing -->
    <path d="M128 222 L150 262 L176 222" stroke-width="3"/>
    <path d="M138 222 L150 246 L164 222" stroke-width="1.5"/>
    <!-- sleeve folds -->
    <path d="M84 238 C72 290 66 330 62 380" stroke-width="2"/>
    <path d="M216 238 C228 290 234 330 238 380" stroke-width="2"/>
    <path d="M100 300 C124 312 176 312 200 300" stroke-width="2.5"/>
  </g>
</svg>
